services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: doctory_app_dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      MONGO_URI: mongodb://${MONGO_USER:-root}:${MONGO_PASS:-rootpassword}@mongo:27017/${MONGO_DB_NAME:-clinic_db}?authSource=admin
      AI_SERVICE_URL: http://ai:8000
      NO_SHOW_HIGH_RISK_THRESHOLD: "0.70"
      DEFAULT_CONSULTATION_MINUTES: "20"
      DEPOSIT_MODE: optional
    volumes:
      # Mount source code so changes are reflected instantly
      - .:/app
      # Keep container node_modules separate (don't overwrite with host)
      - /app/node_modules
    depends_on:
      mongo:
        condition: service_healthy
      ai:
        condition: service_healthy
    networks:
      - doctory_net

  mongo:
    image: mongo:7
    container_name: doctory_mongo_dev
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-rootpassword}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-clinic_db}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data_dev:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - doctory_net

  ai:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: doctory_ai_dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      PORT: "8000"
      MODEL_VERSION: "duration-v1.0.0-no-show-v1.0.0"
      FEATURE_SCHEMA_VERSION: "booking-features-v1"
    volumes:
      - ./ml:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - doctory_net

  seed:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: doctory_seed_dev
    env_file:
      - .env
    environment:
      NODE_ENV: development
      MONGO_URI: mongodb://${MONGO_USER:-root}:${MONGO_PASS:-rootpassword}@mongo:27017/${MONGO_DB_NAME:-clinic_db}?authSource=admin
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      mongo:
        condition: service_healthy
      app:
        condition: service_started
    command: npm run seed
    networks:
      - doctory_net

volumes:
  mongo_data_dev:

networks:
  doctory_net:
    driver: bridge
