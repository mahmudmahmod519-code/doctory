services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: doctory_app_dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DB_HOST: mysql
      DB_PORT: 3306
    volumes:
      # Mount source code so changes are reflected instantly
      - .:/app
      # Keep container node_modules separate (don't overwrite with host)
      - /app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - doctory_net

  mysql:
    image: mysql:8.0
    container_name: doctory_mysql_dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-clinic_db}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data_dev:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - doctory_net

volumes:
  mysql_data_dev:

networks:
  doctory_net:
    driver: bridge
