services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doctory_app_prod
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://${MONGO_USER:-root}:${MONGO_PASS:-rootpassword}@mongo:27017/${MONGO_DB_NAME:-clinic_db}?authSource=admin
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - doctory_net

  mongo:
    image: mongo:7
    container_name: doctory_mongo_prod
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-rootpassword}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-clinic_db}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data_prod:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - doctory_net

volumes:
  mongo_data_prod:

networks:
  doctory_net:
    driver: bridge
